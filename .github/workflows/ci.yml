name: CI

# Runs on pushes to main and on pull requests from branches of this repository. It uses no secrets, needs only read
# access and never runs code from a fork with write permissions. Agents cannot edit this file (.github/ is off limits).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Required project files exist and are not empty
        shell: bash
        run: |
          for f in README.md SOURCES.md docs/PROJECT_SPEC.md; do
            test -s "$f" || { echo "::error::missing or empty $f"; exit 1; }
          done
      - name: Unit tests (at least 8, none skipped)
        shell: bash
        run: |
          python -m unittest discover -s tests -t . -v 2>&1 | tee "$RUNNER_TEMP/test.log"
          n=$(grep -Eo '^Ran [0-9]+ test' "$RUNNER_TEMP/test.log" | grep -Eo '[0-9]+' || true)
          if [ "${n:-0}" -lt 8 ]; then echo "::error::only ${n:-0} tests ran; at least 8 are required"; exit 1; fi
          if ! grep -Eq '^OK$' "$RUNNER_TEMP/test.log"; then echo "::error::tests must pass with none skipped or expected-failure"; exit 1; fi
